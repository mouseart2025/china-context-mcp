[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "china-context-mcp"
version = "0.1.5"
description = "把中文世界的数据源桥接成 AI 工具：今日诗词、中国节假日/调休工作日判断（零凭证、免交付）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.0.0", "fastmcp>=4.0.0,<5"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
china-context-mcp = "china_context_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/china_context_mcp"]
